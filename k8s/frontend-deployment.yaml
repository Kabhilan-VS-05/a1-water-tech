apiVersion: apps/v1
kind: Deployment
metadata:
  name: a1-frontend
  labels:
    app: a1-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: a1-frontend
  template:
    metadata:
      labels:
        app: a1-frontend
    spec:
      containers:
        - name: a1-frontend
          image: a1-frontend
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
